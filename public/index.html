<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script src="config.js"></script>
    <link rel="manifest" href="manifest.json">
    <script>
        // Prevent theme flicker by setting theme immediately
        (function() {
            const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
        document.addEventListener('DOMContentLoaded', () => {
            const siteTitle = window.appConfig.title;
            document.title = siteTitle;
            const titleEl = document.getElementById('instance-name');
            if (titleEl) titleEl.textContent = siteTitle;
        });
    </script>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <main>
        <div class="container">
            <button id="themeToggle" aria-label="Toggle theme">
                <svg class="moon" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="sun" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y1="4.22"></line>
                </svg>
            </button>

            <header>
                <nav class="view-tabs" aria-label="Pages">
                    <button class="view-tab active" data-view="budget"><span id="instance-name">My Budget</span></button>
                    <button class="view-tab" data-view="overview">Overview</button>
                </nav>
            </header>

            <div id="budgetView" class="view">

            <section class="overview">
                <div class="balance-card">
                    <h3>Total spent</h3>
                    <div class="amount" id="totalSpent">0,00</div>
                    <div class="spent-split">
                        <span class="good-text">Good <strong id="totalGood">0</strong></span>
                        <span class="split-dot">·</span>
                        <span class="dumb-text">Dumb <strong id="totalDumb">0</strong></span>
                    </div>
                </div>
            </section>

            <div class="action-row">
                <div class="month-control">
                    <button class="month-step" data-step="-1" aria-label="Previous month">&#8249;</button>
                    <button id="monthPickerBtn" class="month-picker-btn" aria-haspopup="true" aria-expanded="false">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <span class="selected-month-label">November 2026</span>
                    </button>
                    <button class="month-step" data-step="1" aria-label="Next month">&#8250;</button>

                    <!-- Pop-up month picker: choose a year, then a month -->
                    <div id="monthPicker" class="month-picker" hidden>
                        <div class="picker-year">
                            <button type="button" id="pickerPrevYear" aria-label="Previous year">&#8249;</button>
                            <span id="pickerYear">2026</span>
                            <button type="button" id="pickerNextYear" aria-label="Next year">&#8250;</button>
                        </div>
                        <div class="picker-months" id="pickerMonths"></div>
                        <button type="button" id="pickerThisMonth" class="picker-today">This month</button>
                    </div>
                </div>
                <button id="addTransactionBtn" class="add-transaction-btn">Add Expense</button>
            </div>

            <!-- Hidden: the selected month's first and last day (used to load data) -->
            <input type="hidden" id="startDate">
            <input type="hidden" id="endDate">

            <section class="transactions">
                <div class="transactions-header">
                    <h3>Transactions</h3>
                    <div class="sort-controls">
                        <div class="sort-type-toggle">
                            <button class="sort-btn active" data-sort="date" aria-label="Sort by date">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                            </button>
                            <button class="sort-btn" data-sort="amount" aria-label="Sort by amount">
                                <span class="currency-sort-symbol"></span>
                            </button>
                        </div>
                        <button id="sortDirection" aria-label="Sort direction" class="sort-direction-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 20V4"/>
                                <path d="M5 11l7-7 7 7"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="transactionsList">
                    <!-- Transactions will be populated here via JavaScript -->
                </div>
            </section>

            <footer>
                <div class="export-buttons">
                    <button id="exportBtn" class="export-btn">CSV</button>
                    <button id="exportPdfBtn" class="export-btn">PDF</button>
                </div>
            </footer>
            </div>

            <div id="overviewView" class="view" hidden>
                <div class="month-nav">
                    <button class="month-btn month-step" data-step="-1" aria-label="Previous month">&#8249;</button>
                    <span class="month-label selected-month-label">November 2026</span>
                    <button class="month-btn month-step" data-step="1" aria-label="Next month">&#8250;</button>
                </div>

                <div class="ring-wrap" id="ringWrap">
                    <svg class="ring" viewBox="0 0 100 100" id="ringSvg" aria-hidden="true"></svg>
                    <div class="ring-center">
                        <div class="ring-total" id="ringTotal">0</div>
                        <div class="ring-good" id="ringGood">0</div>
                        <div class="ring-dumb" id="ringDumb">0</div>
                    </div>
                    <div id="ringIcons"></div>
                </div>

                <div class="split-bar-card">
                    <div class="split-bar-labels">
                        <span class="good-text" id="goodPct">Good 0%</span>
                        <span class="dumb-text" id="dumbPct">Dumb 0%</span>
                    </div>
                    <div class="split-bar"><div class="split-bar-good" id="splitBarGood"></div><div class="split-bar-dumb" id="splitBarDumb"></div></div>
                </div>

                <div class="category-list" id="categoryList"></div>
            </div>
        </div>
        <div id="toast-container" class="toast-container"></div>
    </main>

    <!-- Transaction Modal -->
    <div id="transactionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add expense</h2>
                <button class="close-modal" aria-label="Close">&times;</button>
            </div>
            <form id="transactionForm">
                <label class="field-label" for="category">Category</label>
                <div id="categoryField">
                    <select id="category" required>
                        <option value="Bills">Bills</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Other">Other</option>
                        <option value="add_new">+ Add Category</option>
                    </select>
                    <div id="customCategoryField" style="display: none;">
                        <input type="text" id="customCategory" placeholder="Enter new category">
                        <button type="button" id="saveCategory">Add</button>
                        <button type="button" id="cancelCategory">Cancel</button>
                    </div>
                </div>
                <label class="field-label" for="amount">Amount</label>
                <div class="amount-input-wrapper">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="amount" placeholder="0.00" required step="0.01" min="0.01" inputmode="decimal">
                </div>
                <label class="field-label" for="purchaseType">Was it worth it?</label>
                <select id="purchaseType" required>
                    <option value="" disabled selected>Choose…</option>
                    <option value="good">👍 Good purchase</option>
                    <option value="dumb">👎 Dumb purchase</option>
                </select>
                <label class="field-label" for="transactionDate">Date</label>
                <input type="date" id="transactionDate" required>
                <textarea id="notes" placeholder="Notes (optional)" rows="2"></textarea>
                <button type="submit">Add</button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
